apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-service
  labels:
    app: storage-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: storage-service
  template:
    metadata:
      labels:
        app: storage-service
    spec:
      containers:
      - name: storage-service
        image: storage-service:1.0.0
        ports:
        - containerPort: 8001
        envFrom:
        - configMapRef:
            name: platform-config
        - secretRef:
            name: platform-secrets
