version: '3.8'

networks:
  platform-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

services:
  # ==========================================
  # Core Infrastructure
  # ==========================================
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platform_secret}
      POSTGRES_DB: ${POSTGRES_DB:-platform_db}
    ports:
      - "5432:5432"
    networks:
      - platform-net
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    # BUG-11 fix: healthcheck so dependent services wait for Postgres to be ready
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-platform}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - platform-net
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks:
      - platform-net
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  namenode:
    image: apache/hadoop:3
    container_name: namenode
    environment:
      - HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop
    command: >
      bash -c "if [ ! -d /hadoop/dfs/name/current ]; then hdfs namenode -format platform -force -nonInteractive; fi && hdfs namenode"
    ports:
      - "9870:9870"
      - "9000:9000"
    volumes:
      - hadoop_namenode:/hadoop/dfs/name
      - ./infrastructure/docker/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
      - ./infrastructure/docker/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml
    networks:
      - platform-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9870"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  datanode-1:
    image: apache/hadoop:3
    container_name: datanode-1
    command: ["hdfs", "datanode"]
    depends_on:
      namenode:
        condition: service_healthy
    environment:
      - HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop
    volumes:
      - hadoop_datanode_1:/hadoop/dfs/data
      - ./infrastructure/docker/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
      - ./infrastructure/docker/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml
    networks:
      - platform-net

  datanode-2:
    image: apache/hadoop:3
    container_name: datanode-2
    command: ["hdfs", "datanode"]
    depends_on:
      namenode:
        condition: service_healthy
    environment:
      - HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop
    volumes:
      - hadoop_datanode_2:/hadoop/dfs/data
      - ./infrastructure/docker/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
      - ./infrastructure/docker/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml
    networks:
      - platform-net

  datanode-3:
    image: apache/hadoop:3
    container_name: datanode-3
    command: ["hdfs", "datanode"]
    depends_on:
      namenode:
        condition: service_healthy
    environment:
      - HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop
    volumes:
      - hadoop_datanode_3:/hadoop/dfs/data
      - ./infrastructure/docker/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
      - ./infrastructure/docker/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml
    networks:
      - platform-net

  spark-master:
    image: apache/spark:3.5.0
    container_name: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080"
      - "7077:7077"
    networks:
      - platform-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  spark-worker-1:
    image: apache/spark:3.5.0
    container_name: spark-worker-1
    depends_on:
      spark-master:
        condition: service_healthy
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      - SPARK_WORKER_MEMORY=4G
      - SPARK_WORKER_CORES=2
    networks:
      - platform-net

  spark-worker-2:
    image: apache/spark:3.5.0
    container_name: spark-worker-2
    depends_on:
      spark-master:
        condition: service_healthy
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      - SPARK_WORKER_MEMORY=4G
      - SPARK_WORKER_CORES=2
    networks:
      - platform-net

  spark-worker-3:
    image: apache/spark:3.5.0
    container_name: spark-worker-3
    depends_on:
      spark-master:
        condition: service_healthy
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      - SPARK_WORKER_MEMORY=4G
      - SPARK_WORKER_CORES=2
    networks:
      - platform-net

  livy:
    build:
      context: ./livy
      dockerfile: Dockerfile
    container_name: livy
    depends_on:
      spark-master:
        condition: service_healthy
    networks:
      - platform-net
    ports:
      - "8998:8998"
    environment:
      LIVY_SPARK_MASTER: spark://spark-master:7077
      LIVY_SPARK_DEPLOY_MODE: client
    volumes:
      - ./services/preprocessing-service/app/jobs:/opt/spark/jobs/preprocessing
      - ./services/training-service/app/jobs:/opt/spark/jobs/training
      - ./services/streaming-service/app/jobs:/opt/spark/jobs/streaming
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8998/sessions"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s


  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.3
    container_name: mlflow
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
    entrypoint: ["bash", "-c"]
    command:
      - |
        pip install --quiet psycopg2-binary &&
        mlflow server \
        --backend-store-uri postgresql://platform:platform_secret@postgres:5432/platform_db \
        --default-artifact-root /mlflow-artifacts \
        --host 0.0.0.0
    volumes:
      - mlflow_data:/mlflow-artifacts
    networks:
      - platform-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\""]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ==========================================
  # Monitoring Stack
  # ==========================================
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - platform-net

  grafana:
    image: grafana/grafana:10.0.3
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    networks:
      - platform-net


  # ==========================================
  # Microservices
  # BUG-10 fix: use config/.env (not config/.env.example) for real secret values
  # BUG-11 fix: all services use condition: service_healthy on infra dependencies
  # BUG-26 fix: api-gateway depends_on ALL downstream microservices
  # ==========================================
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: api-gateway
    env_file:
      - config/.env
    ports:
      - "8000:8000"
    networks:
      - platform-net
    depends_on:
      - storage-service
      - preprocessing-service
      - training-service
      - evaluation-service
      - registry-service
      - serving-service
      - worker-registry
      - resource-manager
      - scheduler

  storage-service:
    build:
      context: .
      dockerfile: services/storage-service/Dockerfile
    container_name: storage-service
    env_file:
      - config/.env
    ports:
      - "8001:8001"
    networks:
      - platform-net
    depends_on:
      postgres:
        condition: service_healthy
      namenode:
        condition: service_healthy

  preprocessing-service:
    build:
      context: .
      dockerfile: services/preprocessing-service/Dockerfile
    container_name: preprocessing-service
    env_file:
      - config/.env
    ports:
      - "8002:8002"
    networks:
      - platform-net
    depends_on:
      postgres:
        condition: service_healthy
      livy:
        condition: service_healthy

  training-service:
    build:
      context: .
      dockerfile: services/training-service/Dockerfile
    container_name: training-service
    env_file:
      - config/.env
    ports:
      - "8003:8003"
    networks:
      - platform-net
    depends_on:
      postgres:
        condition: service_healthy
      livy:
        condition: service_healthy
      mlflow:
        condition: service_healthy

  evaluation-service:
    build:
      context: .
      dockerfile: services/evaluation-service/Dockerfile
    container_name: evaluation-service
    env_file:
      - config/.env
    ports:
      - "8004:8004"
    networks:
      - platform-net
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy

  registry-service:
    build:
      context: .
      dockerfile: services/registry-service/Dockerfile
    container_name: registry-service
    env_file:
      - config/.env
    ports:
      - "8005:8005"
    networks:
      - platform-net
    depends_on:
      mlflow:
        condition: service_healthy

  serving-service:
    build:
      context: .
      dockerfile: services/serving-service/Dockerfile
    container_name: serving-service
    env_file:
      - config/.env
    ports:
      - "8006:8006"
    networks:
      - platform-net
    depends_on:
      mlflow:
        condition: service_healthy

  worker-registry:
    build:
      context: .
      dockerfile: services/worker-registry/Dockerfile
    container_name: worker-registry
    env_file:
      - config/.env
    ports:
      - "8008:8008"
    networks:
      - platform-net
    depends_on:
      postgres:
        condition: service_healthy

  resource-manager:
    build:
      context: .
      dockerfile: services/resource-manager/Dockerfile
    container_name: resource-manager
    env_file:
      - config/.env
    ports:
      - "8009:8009"
    networks:
      - platform-net
    depends_on:
      postgres:
        condition: service_healthy
      worker-registry:
        condition: service_started
      kafka:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: services/scheduler/Dockerfile
    container_name: scheduler
    env_file:
      - config/.env
    ports:
      - "8010:8010"
    networks:
      - platform-net
    depends_on:
      worker-registry:
        condition: service_started
      resource-manager:
        condition: service_started

  ssh-executor:
    build:
      context: .
      dockerfile: services/ssh-executor/Dockerfile
    container_name: ssh-executor
    env_file:
      - config/.env
    ports:
      - "8011:8011"
    networks:
      - platform-net

  worker-node-1:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: worker-node-1
    environment:
      - CONTROL_PLANE_URL=http://api-gateway:8000
      - WORKER_REGISTRY_URL=http://worker-registry:8008
      - RESOURCE_MANAGER_URL=http://resource-manager:8009
      - WORKER_TOKEN=$${INTERNAL_SERVICE_TOKEN:-internal-token-change-me}
      - WORKER_NAME=simulated-worker-1
      - MAX_CPU=4
      - MAX_MEMORY_GB=8.0
      - ALLOW_GPU=false
      - REQUIRE_APPROVAL=true
    networks:
      - platform-net
    depends_on:
      - api-gateway
      - worker-registry
      - resource-manager

volumes:
  postgres_data:
  hadoop_namenode:
  hadoop_datanode_1:
  hadoop_datanode_2:
  hadoop_datanode_3:
  mlflow_data:
  prometheus_data:
  grafana_data:
