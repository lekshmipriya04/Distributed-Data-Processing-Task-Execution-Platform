# The git repository root is the directory ABOVE this project, and GitHub only
# runs workflows from <repo root>/.github/workflows/. All paths below are
# therefore relative to the repo root (project files live under distributed-ai-platform/).
# Move this file to <repo root>/.github/workflows/ci.yml for it to run.
name: CI

on:
  push:
    branches: [ "main", "development" ]
  pull_request:
    branches: [ "main", "development" ]

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: distributed-ai-platform
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"
        cache-dependency-path: distributed-ai-platform/pyproject.toml

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Lint (ruff + mypy)
      run: make lint

    - name: Run unit tests
      run: pytest tests/unit -v --cov=services --cov=shared --cov-report=xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: distributed-ai-platform/frontend
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: "npm"
        cache-dependency-path: distributed-ai-platform/frontend/package-lock.json

    - name: Install and build
      run: |
        npm ci
        npm run build

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: distributed-ai-platform/services/extension-gateway
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: distributed-ai-platform/services/extension-gateway/go.mod
        cache: false

    - name: Test
      run: go test ./...
